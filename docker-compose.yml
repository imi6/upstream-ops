name: upstream-ops

services:
  app:
    image: ghcr.io/bejix/upstream-ops:latest
    restart: unless-stopped
    command: ["-config", "/app/data/config.yaml"]
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8418
      DATABASE_DRIVER: sqlite
      DATABASE_PATH: /app/data/upstream-ops.db
      SERVER_MODE: release
      LOG_LEVEL: info
      APP_SECRET: PLEASE-REPLACE-WITH-32-BYTES-RANDOM-STRING
      # 鉴权默认关闭。设 AUTH_ENABLED=true 时 ADMIN_PASSWORD 也必须填，否则后端启动失败。
      AUTH_ENABLED: false
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ""
      AUTH_TOKEN_SECRET: ""
      # 外部分组倍率接口默认关闭，可在系统设置中生成独立令牌并启用。
      # 也可取消下方注释使用环境变量；非空环境变量优先于页面配置。
      # EXTERNAL_API_ENABLED: "true"
      # EXTERNAL_API_TOKEN: "" # 必填：至少 32 个字符的独立随机令牌
      # EXTERNAL_API_CHANNEL_IDS: "1,3"
      # EXTERNAL_API_ONLY_CREATED_KEY_GROUPS: "true" # 仅筛选外部接口的分组列表
    ports:
      - "8080:8418"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8418/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
