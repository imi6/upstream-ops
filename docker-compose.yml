name: upstream-ops

services:
  app:
    image: ghcr.io/bejix/upstream-ops:latest
    restart: unless-stopped
    command: ["-config", "/app/data/config.yaml"]
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8418
      DATABASE_DRIVER: sqlite
      DATABASE_PATH: /app/data/upstream-ops.db
      SERVER_MODE: release
      LOG_LEVEL: info
      APP_SECRET: PLEASE-REPLACE-WITH-32-BYTES-RANDOM-STRING
      # 鉴权默认关闭。设 AUTH_ENABLED=true 时 ADMIN_PASSWORD 也必须填，否则后端启动失败。
      AUTH_ENABLED: false
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ""
      AUTH_TOKEN_SECRET: ""
    ports:
      - "8080:8418"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8418/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
